@if (value() != undefined) {
  <td class="attribute">{{ key() }}</td>
  <td>
    @for (part of oldDiffParts; track $index) {
      <span [class]="part.type">{{ part.value }}</span>
    }
  </td>
  <td>
    @for (part of newDiffParts; track $index) {
      <span [class]="part.type">{{ part.value }}</span>
    }
  </td>
}
