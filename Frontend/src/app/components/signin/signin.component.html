<div class="container">
  <form #signInForm="ngForm" (ngSubmit)="onSignIn()" autocomplete="off">
    <div>
      <h1>CoffeeDB</h1>
      <h2>Sign in</h2>
    </div>
    <div class="control">
      <label for="username">Username</label>
      <input
        class="full-width-input"
        name="username"
        [(ngModel)]="model.username"
      />
    </div>
    <div class="control">
      <label for="username">Password</label>
      <input
        class="full-width-input"
        name="password"
        [(ngModel)]="model.password"
        autocomplete="current-password"
      />
    </div>
    <div class="bottom-row">
      <button
        class="ephemeral-btn"
        type="button"
        (click)="onNavigateRegister()"
      >
        Create Account
      </button>
      <button class="cta-btn" type="submit">Sign In</button>
    </div>
  </form>
  <footer>
    <p>Help</p>
    <p>Privacy</p>
    <p>Terms</p>
  </footer>
</div>
