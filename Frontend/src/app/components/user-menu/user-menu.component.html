<div class="user-dropdown">
  <ul>
    <li (click)="onPageLinkClick(getProfilePath())">
      <ng-icon [svg]="profileIcon" />
      Profile
    </li>
    <li (click)="onPageLinkClick('settings')">
      <ng-icon [svg]="settingsIcon" />
      Settings
    </li>
    <li (click)="onSignOutClick()">
      <ng-icon [svg]="signOutIcon" />
      Sign Out
    </li>
  </ul>
</div>
